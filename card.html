<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0f1a;color:#e8e0d4;padding:20px;min-height:100vh}
a{color:#d4a94c;text-decoration:none}
a:hover{text-decoration:underline}
.back{display:inline-block;margin-bottom:16px;font-size:.85em}
h1{text-align:center;font-size:1.5em;color:#fff;margin-bottom:4px}
.subtitle{text-align:center;color:#8a8070;font-size:.85em;margin-bottom:24px}
.card-header{display:flex;gap:24px;align-items:stretch;max-width:960px;margin:0 auto 24px;flex-wrap:wrap}
.card-header img{height:240px;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.5);flex-shrink:0;cursor:zoom-in;transition:transform .2s}
.card-header img:hover{transform:scale(1.02)}
.card-img-zoom{cursor:zoom-in}
.image-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:1000;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.image-overlay img{max-width:90vw;max-height:90vh;border-radius:12px;box-shadow:0 8px 48px rgba(0,0,0,.8)}
.image-overlay.hidden{display:none}
.card-details{background:#131a2e;border:1px solid #1e2d4a;border-radius:10px;padding:16px 20px;flex:1;min-width:280px}
.card-details .field{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #1e2d4a}
.card-details .field:last-child{border-bottom:none}
.card-details .field-label{color:#8a8070;font-size:.7em;text-transform:uppercase;letter-spacing:.5px;width:70px;flex-shrink:0}
.card-details .field-values{display:flex;gap:8px;flex-wrap:wrap}
.card-details .copyable{cursor:pointer;font-size:.85em;padding:2px 8px;border-radius:4px;transition:background .15s;position:relative}
.card-details .copyable:hover{background:#1e2d4a}
.card-details .copyable.en{color:#e8e0d4}
.card-details .copyable.ja{color:#d4a94c}
.card-details .copy-icon{font-size:.7em;margin-left:4px}
.card-details .static{font-size:.85em;color:#8a8070;padding:2px 8px}
.card-details .copyable .copied{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.65em;color:#d4a94c;opacity:0;transition:opacity .2s;pointer-events:none}
.card-details .copyable .copied.show{opacity:1}
.no-data{text-align:center;color:#8a8070;padding:60px 20px;font-size:1.1em}
.chart-wrap{max-width:960px;margin:0 auto;background:#131a2e;border-radius:12px;padding:24px;border:1px solid #1e2d4a}
.chart-controls{display:flex;justify-content:flex-end;gap:4px;margin-bottom:12px}
.range-toggle{padding:4px 12px;border-radius:6px;font-size:.72em;font-weight:600;cursor:pointer;border:1px solid #1e2d4a;background:transparent;color:#8a8070;transition:all .15s}
.range-toggle:hover{border-color:#4a4438;color:#e8e0d4}
.range-toggle.active{color:#fff;background:#1e2d4a;border-color:#2e3d5a}
.price-section{max-width:960px;margin:20px auto 0;background:#131a2e;border:1px solid #1e2d4a;border-radius:10px;padding:16px 20px}
.price-section .section-label{font-size:.75em;text-transform:uppercase;letter-spacing:1px;color:#8a8070;margin-bottom:10px}
.price-section .section-label.err{color:#c44d4d}
.price-section .section-label.err .kanji{font-weight:700}
.price-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.price-col{text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:6px;transition:opacity .15s}
.price-col:hover{opacity:.6}
.price-col .grade-label{font-size:.7em;text-transform:uppercase;letter-spacing:1px;font-weight:700;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.price-col .price-big{font-size:1.5em;font-weight:700;color:#fff;min-height:1.4em;display:flex;align-items:center}
.price-col .detail{font-size:.7em;color:#8a8070;min-height:1.2em;display:flex;align-items:center}
@media(max-width:600px){.price-row{grid-template-columns:repeat(2,1fr)}}
.history-box{max-width:960px;margin:20px auto 0;background:#131a2e;border:1px solid #1e2d4a;border-radius:10px;padding:16px 20px}
.history-box h2{font-size:1em;color:#fff;margin-bottom:12px}
.grade-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.grade-tab{padding:6px 14px;border-radius:6px;font-size:.8em;font-weight:600;cursor:pointer;border:1px solid #1e2d4a;background:transparent;color:#8a8070;transition:all .15s}
.grade-tab:hover{border-color:#4a4438}
.grade-tab.active{color:#fff}
.sale-list-wrap{height:400px;overflow-y:auto}
.sale-list-wrap::-webkit-scrollbar{width:6px}
.sale-list-wrap::-webkit-scrollbar-track{background:#0a0f1a;border-radius:3px}
.sale-list-wrap::-webkit-scrollbar-thumb{background:#1e2d4a;border-radius:3px}
.sale-list-wrap::-webkit-scrollbar-thumb:hover{background:#2e3d5a}
.sale-list{list-style:none}
.sale-list li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid #ffffff08;font-size:.8em}
.sale-list .sale-date{color:#8a8070;flex-shrink:0;width:80px}
.sale-list .sale-grade{flex-shrink:0;width:28px;font-size:.7em;font-weight:700;text-align:left;white-space:nowrap}
.sale-list .sale-price{color:#fff;font-weight:600;flex-shrink:0;width:70px;text-align:right}
.sale-list .sale-title{color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-badge{display:inline-block;background:rgba(239,68,68,.2);color:#ef4444;font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.sale-link{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:inherit;width:100%}
.sale-link:hover .sale-title{color:#aaa}
.sale-link:hover .sale-price{color:#d4a94c}
.footer{text-align:center;color:#8a8070;font-size:.85em;margin-top:32px}
.footer a{color:#d4a94c}
@media(max-width:700px){
  .card-header{flex-direction:column;align-items:center}
  .card-header img{height:240px;order:2}
  .card-details{min-width:0;width:100%;order:1}
}
@media(max-width:600px){
  .card-header img{height:240px}
  .card-details .field-label{width:55px;font-size:.65em}
  .card-details .copyable{font-size:.78em}
  .chart-wrap{padding:12px 8px}
  .stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:1.2em}
}
</style>
</head>
<body>

<a href="index.html" class="back">← All Cards</a>
<h1 id="cardTitle"></h1>
<p class="subtitle" id="cardSubtitle"></p>

<div class="card-header" id="cardHeader"></div>

<div class="chart-wrap" id="chartWrap" style="display:none">
  <div class="chart-controls">
    <button class="range-toggle active" data-range="all">All Time</button>
    <button class="range-toggle" data-range="90d">90 Days</button>
    <button class="range-toggle" data-range="30d">30 Days</button>
    <button class="range-toggle" id="errorToggle" style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;border:2px solid #ef4444;border-radius:50%;background:transparent"></span>朗 Error</button>
  </div>
  <canvas id="priceChart"></canvas>
</div>

<div class="price-section" id="priceRowStd"></div>
<div class="price-section" id="priceRowErr" style="margin-top:12px"></div>

<div class="history-box" id="historyBox" style="display:none">
  <h2>Sales History</h2>
  <div class="grade-tabs" id="gradeTabs"></div>
  <div id="saleCount" style="font-size:.8em;color:#666;margin-bottom:12px;font-style:italic"></div>
  <div class="sale-list-wrap"><ul class="sale-list" id="saleList"></ul></div>
</div>

<p class="footer">Maintained by <a href="https://x.com/axiemaid" target="_blank">axiemaid</a> · Updated <span id="lastUpdate">—</span></p>

<div class="image-overlay hidden" id="imageOverlay" onclick="closeImageOverlay()">
  <img id="overlayImage" src="" alt="Card detail">
</div>

<script>
function openImageOverlay(cardId) {
  const overlay = document.getElementById('imageOverlay');
  const img = document.getElementById('overlayImage');
  img.src = 'images/detail/' + cardId + '.webp';
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeImageOverlay() {
  const overlay = document.getElementById('imageOverlay');
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}

// Close on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeImageOverlay();
});
function copyText(el, text) {
  navigator.clipboard.writeText(text);
  const badge = el.querySelector('.copied');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 1000);
}

const GRADE_CONFIG = {
  A: { color: '#d4a94c', label: 'Grade A (Near Mint)' },
  B: { color: '#5b9bd5', label: 'Grade B (Good)' },
  C: { color: '#a78bba', label: 'Grade C (Fair)' },
  D: { color: '#8c7a6b', label: 'Grade D (Poor)' },
};

async function init() {
  const params = new URLSearchParams(location.search);
  const cardId = params.get('id');
  if (!cardId) { document.getElementById('cardTitle').textContent = 'No card specified'; return; }

  const [cardsRes, salesRes] = await Promise.all([fetch('cards.json'), fetch('sales.json')]);
  const cardsData = await cardsRes.json();
  const allSales = await salesRes.json();

  const cards = cardsData.cards || cardsData;
  const card = (Array.isArray(cards) ? cards : Object.values(cards)).find(c => c.id === cardId);
  if (!card) { document.getElementById('cardTitle').textContent = 'Card not found: ' + cardId; return; }

  const sales = allSales.filter(s => s.card_id === cardId);

  // Title
  const displayName = card.name?.en || card.id.toUpperCase();
  const titleText = card.title?.en ? card.title.en : '';
  document.getElementById('cardTitle').textContent = card.id.toUpperCase() + ' ' + (titleText || displayName);
  document.title = card.id.toUpperCase() + ' ' + (titleText || displayName) + ' — Price Tracker';
  document.getElementById('cardSubtitle').textContent =
    (card.series || 'One Piece Hyper Battle') + ' (' + (card.released || '') + ') — Mercari Japan Sold Prices';

  // Card header
  const headerEl = document.getElementById('cardHeader');
  const imgFile = card.id + '.png';
  const fields = [];
  if (card.name) {
    const vals = [];
    if (card.name.en) vals.push(`<span class="copyable en" onclick="copyText(this,'${card.name.en}')">${card.name.en}<span class="copy-icon">📋</span><span class="copied">Copied!</span></span>`);
    if (card.name.ja) vals.push(`<span class="copyable ja" onclick="copyText(this,'${card.name.ja}')">${card.name.ja}<span class="copy-icon">📋</span><span class="copied">Copied!</span></span>`);
    fields.push({ label: 'Name', values: vals.join('') });
  }
  if (card.title) {
    const vals = [];
    if (card.title.en) vals.push(`<span class="copyable en" onclick="copyText(this,'${card.title.en}')">${card.title.en}<span class="copy-icon">📋</span><span class="copied">Copied!</span></span>`);
    if (card.title.ja) vals.push(`<span class="copyable ja" onclick="copyText(this,'${card.title.ja}')">${card.title.ja}<span class="copy-icon">📋</span><span class="copied">Copied!</span></span>`);
    fields.push({ label: 'Title', values: vals.join('') });
  }
  if (card.types) fields.push({ label: 'Type', values: `<span class="static">${card.types.join(', ')}</span>` });
  if (card.set) fields.push({ label: 'Set', values: `<span class="static">${card.set}</span>` });
  if (card.released) fields.push({ label: 'Released', values: `<span class="static">${card.released}</span>` });
  if (card.power != null) {
    const powerStr = card.powerUp ? card.power + ' → ' + card.powerUp : String(card.power);
    fields.push({ label: 'Power', values: `<span class="static">${powerStr}</span>` });
  }

  headerEl.innerHTML = `
    <img src="images/detail/${card.id}.webp" alt="${card.id}" class="card-img-zoom" onclick="openImageOverlay('${card.id}')" onerror="this.style.display='none'">
    <div class="card-details">
      ${fields.map(f => `<div class="field"><span class="field-label">${f.label}</span><div class="field-values">${f.values}</div></div>`).join('')}
    </div>
  `;

  if (sales.length === 0) {
    document.getElementById('statsGrid').innerHTML = '<div class="no-data">No sales data yet for this card.</div>';
    return;
  }

  // Chart
  document.getElementById('chartWrap').style.display = '';
  const byGrade = {};
  sales.forEach(s => {
    if (!byGrade[s.grade]) byGrade[s.grade] = [];
    byGrade[s.grade].push({ x: s.sold_date, y: s.price_jpy, title: s.title, id: s.item_id, error_print: !!s.error_print });
  });

  const datasets = Object.entries(GRADE_CONFIG)
    .filter(([g]) => byGrade[g] && byGrade[g].length > 0)
    .map(([grade, cfg]) => ({
      label: cfg.label,
      data: byGrade[grade].map(d => ({ x: d.x, y: d.y, title: d.title, id: d.id, error_print: d.error_print })),
      backgroundColor: cfg.color,
      borderColor: cfg.color,
      pointBorderColor: byGrade[grade].map(d => d.error_print ? '#ef4444' : cfg.color),
      pointBorderWidth: byGrade[grade].map(d => d.error_print ? 1 : 0),
      pointRadius: window.innerWidth < 600 ? 4 : 5,
      pointHoverRadius: window.innerWidth < 600 ? 6 : 8,
      pointStyle: 'circle',
      showLine: false,
    }));

  const ctx = document.getElementById('priceChart').getContext('2d');
  const priceChart = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: window.innerWidth < 600 ? 1.2 : 2,
      scales: {
        x: {
          type: 'time',
          time: { unit: 'week', tooltipFormat: 'yyyy-MM-dd', displayFormats: { week: 'MMM d', day: 'MMM d' } },
          title: { display: window.innerWidth >= 600, text: 'Sold Date', color: '#8a8070' },
          grid: { color: '#1e2d4a' },
          ticks: { color: '#8a8070', maxRotation: 45, font: { size: window.innerWidth < 600 ? 9 : 12 } },
        },
        y: {
          title: { display: window.innerWidth >= 600, text: 'Price (¥)', color: '#8a8070' },
          grid: { color: '#1e2d4a' },
          ticks: { color: '#8a8070', callback: v => '¥' + v.toLocaleString(), font: { size: window.innerWidth < 600 ? 9 : 12 } },
          beginAtZero: true,
        },
      },
      plugins: {
        legend: {
          labels: {
            color: '#e8e0d4',
            usePointStyle: true,
            padding: window.innerWidth < 600 ? 8 : 16,
            font: { size: window.innerWidth < 600 ? 10 : 12 },
            filter: () => true,
          },
        },
        tooltip: {
          callbacks: {
            title: ctx => ctx[0]?.raw?.x || '',
            label: ctx => {
              const d = ctx.raw;
              const lines = ['¥' + d.y.toLocaleString() + ' (' + ctx.dataset.label + ')'];
              if (d.title) lines.push(d.title.length > 50 ? d.title.slice(0, 50) + '…' : d.title);
              return lines;
            },
          },
        },
      },
    },
  });

  // Store full datasets for range filtering
  const fullDatasetData = datasets.map(ds => ds.data);
  const fullPointBorderColor = datasets.map(ds => ds.pointBorderColor);
  const fullPointBorderWidth = datasets.map(ds => ds.pointBorderWidth);

  // Grade price rows - standard and error, 30d mean with fallback to last 10
  const priceRowStd = document.getElementById('priceRowStd');
  const priceRowErr = document.getElementById('priceRowErr');
  const now = new Date();
  const day30 = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const mean = arr => arr.length === 0 ? null : arr.reduce((a, b) => a + b, 0) / arr.length;
  
  function renderPriceSection(containerEl, salesSubset, label, labelClass, isError) {
    const gradesPresent = ['A','B','C','D'].filter(g => salesSubset.some(s => s.grade === g));
    if (gradesPresent.length === 0) return;
    
    containerEl.innerHTML = '';
    const labelEl = document.createElement('div');
    labelEl.className = 'section-label' + (labelClass ? ' ' + labelClass : '');
    labelEl.textContent = label;
    containerEl.appendChild(labelEl);
    
    const row = document.createElement('div');
    row.className = 'price-row';
    
    gradesPresent.forEach(g => {
      const pts = salesSubset.filter(s => s.grade === g).sort((a, b) => new Date(b.sold_date) - new Date(a.sold_date));
      const cfg = GRADE_CONFIG[g];
      const recent30 = pts.filter(s => new Date(s.sold_date) >= day30).map(s => s.price_jpy);
      let priceMean, lbl;
      if (recent30.length >= 3) {
        priceMean = Math.round(mean(recent30));
        lbl = '30d avg';
      } else {
        const last10 = pts.slice(0, 10).map(s => s.price_jpy);
        priceMean = Math.round(mean(last10));
        lbl = `Last ${last10.length} avg`;
      }
      const col = document.createElement('div');
      col.className = 'price-col';
      col.style.cursor = 'pointer';
      col.innerHTML = `
        <div class="grade-label" style="color:${cfg.color}">${cfg.label}</div>
        <div class="price-big">¥${priceMean.toLocaleString()}</div>
        <div class="detail">${lbl}</div>
      `;
      col.addEventListener('click', () => {
        activeFilter = activeFilter === g ? 'All' : g;
        renderTabs();
        renderSales();
        filterChart();
      });
      row.appendChild(col);
    });
    containerEl.appendChild(row);
  }
  
  const stdSales = sales.filter(s => !s.error_print);
  const errSales = sales.filter(s => s.error_print);
  renderPriceSection(priceRowStd, stdSales, 'Standard Sales', '', false);
  renderPriceSection(priceRowErr, errSales, 'Error Print Sales 朗', 'err', true);

  // Sales history box
  const stdSorted = stdSales.slice().sort((a, b) => new Date(b.sold_date) - new Date(a.sold_date));
  const errSorted = errSales.slice().sort((a, b) => new Date(b.sold_date) - new Date(a.sold_date));
  const historyBox = document.getElementById('historyBox');
  const gradeTabs = document.getElementById('gradeTabs');
  const saleListEl = document.getElementById('saleList');
  historyBox.style.display = '';

  // Build grade tabs from standard + error sales combined
  const stdByGrade = {};
  stdSales.forEach(s => { if (!stdByGrade[s.grade]) stdByGrade[s.grade] = []; stdByGrade[s.grade].push(s); });
  const errByGrade = {};
  errSales.forEach(s => { if (!errByGrade[s.grade]) errByGrade[s.grade] = []; errByGrade[s.grade].push(s); });
  const availableGrades = ['A','B','C','D'].filter(g => (stdByGrade[g] && stdByGrade[g].length > 0) || (errByGrade[g] && errByGrade[g].length > 0));
  const tabs = ['All', ...availableGrades];
  let activeFilter = 'All';

  // Store original colors for dimming
  const originalColors = priceChart.data.datasets.map(ds => ({
    backgroundColor: ds.backgroundColor,
    borderColor: ds.borderColor,
    pointBorderColor: ds.pointBorderColor,
    pointBorderWidth: ds.pointBorderWidth,
    pointBackgroundColor: ds.pointBackgroundColor || ds.backgroundColor,
  }));

  // Range/error state — declared early so renderSales/filterChart can use them
  let chartRange = 'all';
  let errorOnly = false;

  function getFilteredIdxs(fullData) {
    const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
    let idxs = fullData.map((_, idx) => idx);
    if (chartRange === '30d') idxs = idxs.filter(idx => new Date(fullData[idx].x) >= cutoff);
    return idxs;
  }

  function filterChart() {
    const isAll = activeFilter === 'All';
    priceChart.data.datasets.forEach((ds, i) => {
      const grade = Object.keys(GRADE_CONFIG).find(g => ds.label === GRADE_CONFIG[g].label);
      const matchGrade = grade;
      const active = isAll || matchGrade === activeFilter;
      const orig = originalColors[i];
      if (active) {
        const fullData = fullDatasetData[i];
        const fullBorder = fullPointBorderColor[i];
        const fullWidth = fullPointBorderWidth[i];
        if (ds.showLine === false) {
          const idxs = getFilteredIdxs(fullData);
          ds.data = idxs.map(idx => fullData[idx]);
          if (Array.isArray(fullBorder)) ds.pointBorderColor = idxs.map(idx => fullBorder[idx]);
          if (Array.isArray(fullWidth)) ds.pointBorderWidth = idxs.map(idx => fullWidth[idx]);
          // Apply error-only dimming on top of grade restore
          if (errorOnly) {
            ds.pointBackgroundColor = idxs.map(idx => fullData[idx].error_print ? orig.backgroundColor : (orig.backgroundColor || '#1e2d4a') + '26');
            ds.borderColor = (orig.borderColor || '') + '26';
            ds.pointBorderColor = idxs.map(idx => fullData[idx].error_print ? fullBorder[idx] : (orig.backgroundColor || '#1e2d4a') + '26');
            ds.pointBorderWidth = idxs.map(idx => fullData[idx].error_print ? fullWidth[idx] : 0);
          } else {
            ds.pointBackgroundColor = orig.backgroundColor;
            ds.borderColor = orig.borderColor;
          }
        } else {
          ds.data = fullData;
          if (Array.isArray(fullBorder)) ds.pointBorderColor = fullBorder;
          if (Array.isArray(fullWidth)) ds.pointBorderWidth = fullWidth;
          ds.backgroundColor = orig.backgroundColor;
          ds.borderColor = orig.borderColor;
        }
      } else {
        ds.backgroundColor = (orig.backgroundColor || '') + '26';
        ds.borderColor = (orig.borderColor || '') + '26';
        ds.pointBorderColor = Array.isArray(ds.pointBorderColor)
          ? ds.pointBorderColor.map(() => '#1e2d4a26')
          : '#1e2d4a26';
        ds.pointBorderWidth = 0;
      }
    });
    priceChart.update();
  }

  function renderTabs() {
    gradeTabs.innerHTML = tabs.map(t => {
      const isActive = t === activeFilter;
      const cfg = GRADE_CONFIG[t];
      const activeStyle = isActive
        ? (cfg ? `background:${cfg.color}22;border-color:${cfg.color};color:${cfg.color}` : 'background:#d4a94c22;border-color:#d4a94c;color:#d4a94c')
        : '';
      return `<button class="grade-tab${isActive ? ' active' : ''}" style="${activeStyle}" data-grade="${t}">${t}</button>`;
    }).join('');
    gradeTabs.querySelectorAll('.grade-tab').forEach(btn => {
      btn.addEventListener('click', () => { activeFilter = btn.dataset.grade; renderTabs(); renderSales(); filterChart(); });
    });
  }

  function renderSales() {
    // Standard sales
    let stdFiltered = activeFilter === 'All' ? stdSorted : stdSorted.filter(s => s.grade === activeFilter);
    // Error sales
    let errFiltered = activeFilter === 'All' ? errSorted : errSorted.filter(s => s.grade === activeFilter);
    
    if (errorOnly) { stdFiltered = []; }
    
    const totalCount = stdFiltered.length + errFiltered.length;
    document.getElementById('saleCount').textContent = totalCount + ' sale' + (totalCount !== 1 ? 's' : '');
    
    const renderSaleItem = s => {
      const cfg = GRADE_CONFIG[s.grade] || { color: '#8a8070' };
      return `<li><a href="https://jp.mercari.com/item/${s.item_id}" target="_blank" rel="noopener" class="sale-link">
        <span class="sale-date">${s.sold_date}</span>
        <span class="sale-grade" style="color:${cfg.color}">${s.grade}${s.error_print ? '<span class="err-badge">朗</span>' : ''}</span>
        <span class="sale-price">¥${s.price_jpy.toLocaleString()}</span>
        <span class="sale-title">${(s.title||'').length > 45 ? s.title.slice(0,45)+'…' : s.title}</span>
      </a></li>`;
    };
    
    let html = '';
    if (stdFiltered.length > 0) {
      html += stdFiltered.map(renderSaleItem).join('');
    }
    if (errFiltered.length > 0 && !errorOnly) {
      // Show error sales after standard, with a subtle separator if both exist
      if (stdFiltered.length > 0) {
        html += '<li style="border-bottom:none;padding:4px 0"><span style="color:#c44d4d;font-size:.7em;font-weight:700">朗 Error Print</span></li>';
      }
      html += errFiltered.map(renderSaleItem).join('');
    }
    saleListEl.innerHTML = html;
  }

  renderTabs();
  renderSales();

  function applyRangeFilter() {
    let cutoff = null;
    if (chartRange === '30d') cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
    else if (chartRange === '90d') cutoff = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000);
    priceChart.data.datasets.forEach((ds, i) => {
      const fullData = fullDatasetData[i];
      const fullBorder = fullPointBorderColor[i];
      const fullWidth = fullPointBorderWidth[i];
      if (ds.showLine === false) {
        const idxs = getFilteredIdxs(fullData);
        ds.data = idxs.map(idx => fullData[idx]);
        if (Array.isArray(fullBorder)) ds.pointBorderColor = idxs.map(idx => fullBorder[idx]);
        if (Array.isArray(fullWidth)) ds.pointBorderWidth = idxs.map(idx => fullWidth[idx]);
        // Apply error-only dimming
        const orig = originalColors[i];
        if (errorOnly) {
          ds.pointBackgroundColor = idxs.map(idx => fullData[idx].error_print ? orig.backgroundColor : (orig.backgroundColor || '#1e2d4a') + '26');
          ds.borderColor = (orig.borderColor || '') + '26';
          ds.pointBorderColor = idxs.map(idx => fullData[idx].error_print ? fullBorder[idx] : (orig.backgroundColor || '#1e2d4a') + '26');
          ds.pointBorderWidth = idxs.map(idx => fullData[idx].error_print ? fullWidth[idx] : 0);
        } else {
          ds.pointBackgroundColor = orig.backgroundColor;
          ds.borderColor = orig.borderColor;
        }
      } else {
        ds.data = fullData;
        if (Array.isArray(fullBorder)) ds.pointBorderColor = fullBorder;
        if (Array.isArray(fullWidth)) ds.pointBorderWidth = fullWidth;
      }
    });
    if (cutoff) {
      priceChart.options.scales.x.min = cutoff;
    } else {
      delete priceChart.options.scales.x.min;
    }
    priceChart.update();
  }
  document.querySelectorAll('.range-toggle[data-range]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-toggle[data-range]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartRange = btn.dataset.range;
      applyRangeFilter();
    });
  });

  const errorBtn = document.getElementById('errorToggle');
  errorBtn.addEventListener('click', () => {
    errorOnly = !errorOnly;
    errorBtn.classList.toggle('active', errorOnly);
    applyRangeFilter();
    renderSales();
  });

  // Last update
  const dates = sales.map(s => new Date(s.logged_at));
  if (dates.length) {
    document.getElementById('lastUpdate').textContent =
      new Date(Math.max(...dates)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
}

init();
</script>
</body>
</html>
